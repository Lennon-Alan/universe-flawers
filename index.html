<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Universo de Flores Amarillas</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="space" id="space">
    <div class="space-scene" id="scene">
      <div class="layer layer-nebula">
        <div class="nebula" aria-hidden="true"></div>
      </div>

      <div class="layer layer-shoots" id="shoots" aria-hidden="true"></div>

      <div class="layer layer-stars" id="stars" aria-hidden="true"></div>

      <div class="layer layer-stars-near" id="starsNear" aria-hidden="true"></div>

      <div class="layer layer-bouquets">
        <div class="bouquets" id="bouquets"></div>
      </div>

      <div class="layer layer-hero">
        <div class="hero-wrap" id="heroWrap">
          <div class="hero-glow" aria-hidden="true"></div>
          <div class="hero-sway" id="heroSway">
            <div class="hero-inner" id="heroInner">
              <div class="hero3d" id="hero3d"></div>
              <span class="hero-label">Ramo Estelar Central &#10024;</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <header class="title-overlay">
    <h1>Universo de Flores</h1>
    <p>toca un ramo o arrastra el universo</p>
  </header>

  <div class="bursts" id="bursts" aria-hidden="true"></div>

  <button class="music-btn" id="musicBtn" aria-label="Reproducir música de fondo">&#127925;</button>

  <div class="splash" id="splash">
    <div class="splash-card" id="splashCard">
      <p class="splash-stamp">una carta para ti</p>
      <h1 class="splash-title">Para ti</h1>
      <p class="splash-heart">&#10084;&#65039;</p>
      <p class="splash-note">toca el sello para abrirla</p>
      <button class="seal" id="seal" aria-label="Abrir la carta" type="button">
        <span class="seal-icon">&#9993;&#65039;</span>
      </button>
      <p class="splash-cta">para abrir la carta</p>
    </div>
  </div>

  <div class="modal" id="modal" aria-hidden="true">
    <div class="modal-backdrop" id="modalBackdrop"></div>
    <div class="modal-card" id="modalCard"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
